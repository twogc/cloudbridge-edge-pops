---
# Практичные MASQUE профили для домашних и мобильных сетей
# CloudBridge Edge PoP - Профили оптимизации
# Gaming Profile - максимальная производительность для игр
apiVersion: v1
kind: ConfigMap
metadata:
  name: masque-gaming-profile
  namespace: cloudbridge-relay
  labels:
    app: masque
    profile: gaming
    app.kubernetes.io/name: masque-config
    app.kubernetes.io/component: inter-pop
data:
  masque.yaml: |
    quic:
      port: 9090
      datagrams: true
      bbrv2: true
      ack_frequency: "aggressive"  # Редкие ACK для игр
      keepalive: 5s               # Частые keepalive
      congestion_control: bbr2
      max_idle_timeout: 15s       # Быстрое закрытие неактивных
      max_stream_data_bidi_local: 524288   # Меньше буферов
      max_stream_data_bidi_remote: 524288
      max_stream_data_uni: 524288
      max_data: 2097152           # 2MB max data
      max_streams_bidi: 50        # Меньше потоков
      max_streams_uni: 50
      pacing: true
      pacing_rate: "conservative" # Консервативный pacing

    mtls:
      enabled: true
      ca_secret: cb-ca-bundle
      cert_secret: cb-interpop-cert
      crl_endpoint: "https://crl.2gc.ru/crl/interpop.crl"
      verify_peer_cert: true
      min_tls_version: "1.3"

    masque:
      connect_udp: true
      connect_ip: true
      max_contexts: 8192          # Меньше контекстов для игр
      tenant_header: x-cb-tenant
      context_timeout: 60s        # Короткий timeout
      keepalive_interval: 10s     # Частые keepalive
      max_connections_per_tenant: 100  # Меньше соединений
      fec_enabled: false          # FEC не нужен для игр

    neighbors:
      - name: "EU-FRA"
        endpoint: "fra.pop.cb:443"
        region: "EU-FRA"
        weight: 100
        priority: 1
        latency_threshold: 25ms   # Строгий порог для игр
        cost_multiplier: 1.0
        gaming_optimized: true
      - name: "EU-AMS"
        endpoint: "ams.pop.cb:443"
        region: "EU-AMS"
        weight: 90
        priority: 2
        latency_threshold: 30ms
        cost_multiplier: 1.1
        gaming_optimized: true
      - name: "RU-MOW"
        endpoint: "mow.pop.cb:443"
        region: "RU-MOW"
        weight: 80
        priority: 3
        latency_threshold: 35ms
        cost_multiplier: 0.8
        gaming_optimized: true

    routing:
      algorithm: "gaming_optimized"  # Специальный алгоритм для игр
      ai_service_url: "https://ai.2gc.ru:8083"
      fallback_algorithm: "latency_based"
      max_hops: 2                   # Меньше хопов для игр
      load_balancing: "lowest_latency"
      target_rtt: 20ms              # Целевой RTT для игр
      max_rtt: 50ms                 # Максимальный RTT

    metrics:
      enabled: true
      port: 9091
      path: "/metrics"
      interval: 5s                  # Частые метрики для игр
      labels:
        - "region"
        - "neighbor"
        - "tenant"
        - "profile"

    security:
      rate_limiting:
        enabled: true
        requests_per_second: 2000   # Высокий лимит для игр
        burst_size: 5000
      tenant_isolation:
        enabled: true
        vrf_enabled: true
        network_policies: true
      audit_logging:
        enabled: true
        log_level: "info"
        retention_days: 7           # Меньше логов для игр

    gaming:
      enabled: true
      dscp_marking: "CS6"          # Высший приоритет
      packet_size_optimization: true
      jitter_compensation: true
      ping_spike_detection: true
      handover_aggressiveness: "high"

---
# Streaming Profile - оптимизация для видео/аудио
apiVersion: v1
kind: ConfigMap
metadata:
  name: masque-streaming-profile
  namespace: cloudbridge-relay
  labels:
    app: masque
    profile: streaming
    app.kubernetes.io/name: masque-config
    app.kubernetes.io/component: inter-pop
data:
  masque.yaml: |
    quic:
      port: 9090
      datagrams: true
      bbrv2: true
      ack_frequency: "moderate"    # Умеренные ACK для стрима
      keepalive: 15s              # Реже keepalive
      congestion_control: bbr2
      max_idle_timeout: 60s       # Дольше держим соединения
      max_stream_data_bidi_local: 2097152   # Больше буферов
      max_stream_data_bidi_remote: 2097152
      max_stream_data_uni: 2097152
      max_data: 8388608           # 8MB max data
      max_streams_bidi: 200       # Больше потоков
      max_streams_uni: 200
      pacing: true
      pacing_rate: "aggressive"   # Агрессивный pacing для стрима

    mtls:
      enabled: true
      ca_secret: cb-ca-bundle
      cert_secret: cb-interpop-cert
      crl_endpoint: "https://crl.2gc.ru/crl/interpop.crl"
      verify_peer_cert: true
      min_tls_version: "1.3"

    masque:
      connect_udp: true
      connect_ip: true
      max_contexts: 16384        # Больше контекстов для стрима
      tenant_header: x-cb-tenant
      context_timeout: 300s      # Дольше timeout
      keepalive_interval: 30s   # Реже keepalive
      max_connections_per_tenant: 1000  # Больше соединений
      fec_enabled: true         # FEC нужен для стрима
      fec_overhead: 8           # 8% overhead для FEC

    neighbors:
      - name: "EU-FRA"
        endpoint: "fra.pop.cb:443"
        region: "EU-FRA"
        weight: 100
        priority: 1
        latency_threshold: 50ms   # Мягче порог для стрима
        cost_multiplier: 1.0
        streaming_optimized: true
      - name: "EU-AMS"
        endpoint: "ams.pop.cb:443"
        region: "EU-AMS"
        weight: 95
        priority: 2
        latency_threshold: 55ms
        cost_multiplier: 1.1
        streaming_optimized: true
      - name: "RU-MOW"
        endpoint: "mow.pop.cb:443"
        region: "RU-MOW"
        weight: 90
        priority: 3
        latency_threshold: 60ms
        cost_multiplier: 0.8
        streaming_optimized: true

    routing:
      algorithm: "streaming_optimized"  # Специальный алгоритм для стрима
      ai_service_url: "https://ai.2gc.ru:8083"
      fallback_algorithm: "throughput_based"
      max_hops: 3                      # Больше хопов для стрима
      load_balancing: "weighted_round_robin"
      target_rtt: 30ms                 # Целевой RTT для стрима
      max_rtt: 100ms                   # Максимальный RTT

    metrics:
      enabled: true
      port: 9091
      path: "/metrics"
      interval: 15s                    # Реже метрики для стрима
      labels:
        - "region"
        - "neighbor"
        - "tenant"
        - "profile"

    security:
      rate_limiting:
        enabled: true
        requests_per_second: 1000      # Умеренный лимит для стрима
        burst_size: 2000
      tenant_isolation:
        enabled: true
        vrf_enabled: true
        network_policies: true
      audit_logging:
        enabled: true
        log_level: "info"
        retention_days: 30             # Больше логов для стрима

    streaming:
      enabled: true
      dscp_marking: "AF41"            # Приоритет для видео
      packet_size_optimization: true
      jitter_compensation: true
      stall_detection: true
      rebuffer_prevention: true
      abr_optimization: true
      prefetch_segments: 4
      gentle_downshift: true

---
# Mobile Profile - оптимизация для мобильных сетей
apiVersion: v1
kind: ConfigMap
metadata:
  name: masque-mobile-profile
  namespace: cloudbridge-relay
  labels:
    app: masque
    profile: mobile
    app.kubernetes.io/name: masque-config
    app.kubernetes.io/component: inter-pop
data:
  masque.yaml: |
    quic:
      port: 9090
      datagrams: true
      bbrv2: true
      ack_frequency: "adaptive"    # Адаптивные ACK для мобильных
      keepalive: 10s              # Средние keepalive
      congestion_control: bbr2
      max_idle_timeout: 30s       # Средний timeout
      max_stream_data_bidi_local: 1048576   # Средние буферы
      max_stream_data_bidi_remote: 1048576
      max_stream_data_uni: 1048576
      max_data: 4194304           # 4MB max data
      max_streams_bidi: 100       # Среднее количество потоков
      max_streams_uni: 100
      pacing: true
      pacing_rate: "adaptive"     # Адаптивный pacing
      mtu_discovery: true         # MTU discovery для мобильных
      mtu_size: 1350             # Меньший MTU для мобильных

    mtls:
      enabled: true
      ca_secret: cb-ca-bundle
      cert_secret: cb-interpop-cert
      crl_endpoint: "https://crl.2gc.ru/crl/interpop.crl"
      verify_peer_cert: true
      min_tls_version: "1.3"

    masque:
      connect_udp: true
      connect_ip: true
      max_contexts: 12288        # Среднее количество контекстов
      tenant_header: x-cb-tenant
      context_timeout: 180s       # Средний timeout
      keepalive_interval: 20s     # Средние keepalive
      max_connections_per_tenant: 500   # Среднее количество соединений
      fec_enabled: true           # FEC нужен для мобильных
      fec_overhead: 12            # 12% overhead для FEC

    neighbors:
      - name: "EU-FRA"
        endpoint: "fra.pop.cb:443"
        region: "EU-FRA"
        weight: 100
        priority: 1
        latency_threshold: 45ms   # Мобильный порог
        cost_multiplier: 1.0
        mobile_optimized: true
      - name: "EU-AMS"
        endpoint: "ams.pop.cb:443"
        region: "EU-AMS"
        weight: 95
        priority: 2
        latency_threshold: 50ms
        cost_multiplier: 1.1
        mobile_optimized: true
      - name: "RU-MOW"
        endpoint: "mow.pop.cb:443"
        region: "RU-MOW"
        weight: 90
        priority: 3
        latency_threshold: 55ms
        cost_multiplier: 0.8
        mobile_optimized: true

    routing:
      algorithm: "mobile_optimized"   # Специальный алгоритм для мобильных
      ai_service_url: "https://ai.2gc.ru:8083"
      fallback_algorithm: "congestion_aware"
      max_hops: 3                     # Среднее количество хопов
      load_balancing: "congestion_aware"
      target_rtt: 35ms                # Целевой RTT для мобильных
      max_rtt: 80ms                   # Максимальный RTT

    metrics:
      enabled: true
      port: 9091
      path: "/metrics"
      interval: 10s                   # Средние метрики
      labels:
        - "region"
        - "neighbor"
        - "tenant"
        - "profile"
        - "radio_type"

    security:
      rate_limiting:
        enabled: true
        requests_per_second: 1500     # Средний лимит для мобильных
        burst_size: 3000
      tenant_isolation:
        enabled: true
        vrf_enabled: true
        network_policies: true
      audit_logging:
        enabled: true
        log_level: "info"
        retention_days: 14            # Средние логи

    mobile:
      enabled: true
      dscp_marking: "AF41"            # Приоритет для мобильных
      packet_size_optimization: true
      jitter_compensation: true
      radio_congestion_detection: true
      l4s_ecn_support: true           # Поддержка L4S/ECN
      mp_quic_support: true           # Поддержка MP-QUIC
      connection_migration: true     # Миграция соединений
      ping_spike_detection: true
      handover_aggressiveness: "medium"
      radio_metrics_collection: true



