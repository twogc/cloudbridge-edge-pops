apiVersion: v1
kind: Secret
metadata:
  name: cb-interpop-cert
  namespace: cloudbridge-relay
  labels:
    app: masque
    app.kubernetes.io/name: interpop-cert
    app.kubernetes.io/component: mtls
  annotations:
    cert-manager.io/issuer: "letsencrypt-prod"
    cert-manager.io/auto-renew: "true"
type: kubernetes.io/tls
data:
  tls.crt: <base64-encoded-cert>
  tls.key: <base64-encoded-key>
  ca.crt: <base64-encoded-ca>
---
apiVersion: v1
kind: Secret
metadata:
  name: cb-ca-bundle
  namespace: cloudbridge-relay
  labels:
    app: masque
    app.kubernetes.io/name: ca-bundle
    app.kubernetes.io/component: mtls
type: Opaque
data:
  ca.crt: <base64-encoded-ca>
  crl.pem: <base64-encoded-crl>
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app: cert-manager
    app.kubernetes.io/name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@2gc.ru
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - http01:
        ingress:
          class: nginx
    - dns01:
        cloudflare:
          email: admin@2gc.ru
          apiTokenSecretRef:
            name: cloudflare-api-token
            key: api-token
---
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
  labels:
    app: cert-manager
    app.kubernetes.io/name: cloudflare-token
type: Opaque
data:
  api-token: <base64-encoded-cloudflare-token>
