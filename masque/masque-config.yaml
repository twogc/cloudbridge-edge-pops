---
apiVersion: v1
kind: ConfigMap
metadata:
  name: masque-config
  namespace: cloudbridge-relay
  labels:
    app: masque
    app.kubernetes.io/name: masque-config
    app.kubernetes.io/component: inter-pop
data:
  masque.yaml: |
    quic:
      port: 9090
      datagrams: true
      bbrv2: true
      ack_frequency: true
      keepalive: 10s
      congestion_control: bbr2
      max_idle_timeout: 30s
      max_stream_data_bidi_local: 1048576
      max_stream_data_bidi_remote: 1048576
      max_stream_data_uni: 1048576
      max_data: 10485760
      max_streams_bidi: 100
      max_streams_uni: 100

    mtls:
      enabled: true
      ca_secret: cb-ca-bundle
      cert_secret: cb-interpop-cert
      crl_endpoint: "https://crl.2gc.ru/crl/interpop.crl"
      verify_peer_cert: true
      min_tls_version: "1.3"

    masque:
      connect_udp: true
      connect_ip: true
      max_contexts: 16384
      tenant_header: x-cb-tenant
      context_timeout: 300s
      keepalive_interval: 30s
      max_connections_per_tenant: 1000

    neighbors:
      - name: "EU-FRA"
        endpoint: "fra.pop.cb:443"
        region: "EU-FRA"
        weight: 100
        priority: 1
        latency_threshold: 50ms
        cost_multiplier: 1.0
      - name: "EU-AMS"
        endpoint: "ams.pop.cb:443"
        region: "EU-AMS"
        weight: 90
        priority: 2
        latency_threshold: 45ms
        cost_multiplier: 1.1
      - name: "RU-MOW"
        endpoint: "mow.pop.cb:443"
        region: "RU-MOW"
        weight: 80
        priority: 3
        latency_threshold: 60ms
        cost_multiplier: 0.8

    routing:
      algorithm: "ai_optimized"
      ai_service_url: "https://ai.2gc.ru:8083"
      fallback_algorithm: "latency_based"
      max_hops: 3
      load_balancing: "weighted_round_robin"

    metrics:
      enabled: true
      port: 9091
      path: "/metrics"
      interval: 15s
      labels:
        - "region"
        - "neighbor"
        - "tenant"

    security:
      rate_limiting:
        enabled: true
        requests_per_second: 1000
        burst_size: 2000
      tenant_isolation:
        enabled: true
        vrf_enabled: true
        network_policies: true
      audit_logging:
        enabled: true
        log_level: "info"
        retention_days: 30

