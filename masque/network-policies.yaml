---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: relay-network-policy
  namespace: cloudbridge-relay
  labels:
    app: relay
    app.kubernetes.io/name: relay-network-policy
    app.kubernetes.io/component: security
spec:
  podSelector:
    matchLabels:
      app: cloudbridge-relay
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: cloudbridge-control
    - podSelector:
        matchLabels:
          app: cloudbridge-relay
    ports:
    - protocol: UDP
      port: 443
    - protocol: UDP
      port: 9090
    - protocol: UDP
      port: 9092
    - protocol: UDP
      port: 51820
    - protocol: UDP
      port: 3478
    - protocol: UDP
      port: 19302
    - protocol: TCP
      port: 5550
    - protocol: TCP
      port: 5551
    - protocol: TCP
      port: 5552
    - protocol: TCP
      port: 5553
    - protocol: TCP
      port: 5554
    - protocol: TCP
      port: 8443
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: cloudbridge-control
    - podSelector:
        matchLabels:
          app: cloudbridge-relay
    ports:
    - protocol: UDP
      port: 443
    - protocol: UDP
      port: 9090
    - protocol: UDP
      port: 9092
    - protocol: UDP
      port: 51820
    - protocol: UDP
      port: 3478
    - protocol: UDP
      port: 19302
    - protocol: TCP
      port: 5550
    - protocol: TCP
      port: 5551
    - protocol: TCP
      port: 5552
    - protocol: TCP
      port: 5553
    - protocol: TCP
      port: 5554
    - protocol: TCP
      port: 8443
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
---
