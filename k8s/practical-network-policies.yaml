      - 443
      - 51820
      - 3478
      
  - action: Allow
    protocol: TCP
    source:
      selector: app == "cloudbridge-relay"
    destination:
      ports:
      - 8444
      - 8443
      
  egress:
  # Исходящие правила для тенантов
  - action: Allow
    protocol: UDP
    destination:
      selector: app == "cloudbridge-relay"
    source:
      ports:
      - 443
      - 51820
      - 3478
      
  - action: Allow
    protocol: TCP
    destination:
      selector: app == "cloudbridge-relay"
    source:
      ports:
      - 8444
      - 8443


