# Практичные Network Policies для домашних и мобильных сетей
# CloudBridge Edge PoP - Сетевые политики по профилям

---
# Gaming Profile Network Policy - максимальная производительность
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gaming-profile-policy
  namespace: cloudbridge-relay
  labels:
    app: cloudbridge-relay
    profile: gaming
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/component: security
spec:
  podSelector:
    matchLabels:
      app: cloudbridge-relay
      profile: gaming
  policyTypes:
  - Ingress
  - Egress
  
  ingress:
  # Высокоприоритетный трафик для игр
  - from:
    - namespaceSelector:
        matchLabels:
          name: cloudbridge-control
    - podSelector:
        matchLabels:
          app: cloudbridge-relay
          profile: gaming
    ports:
    - protocol: UDP
      port: 443      # QUIC gaming
    - protocol: UDP
      port: 51820    # WireGuard gaming
    - protocol: UDP
      port: 3478     # TURN gaming
    - protocol: UDP
      port: 9090     # MASQUE gaming
    - protocol: TCP
      port: 8444     # gRPC gaming
    - protocol: TCP
      port: 8443     # REST API gaming
      
  # DSCP маркировка для игрового трафика
  - from:
    - podSelector:
        matchLabels:
          app: gaming-client
    ports:
    - protocol: UDP
      port: 443
    - protocol: UDP
      port: 51820
    - protocol: UDP
      port: 3478
      
  egress:
  # Исходящий трафик для игр
  - to:
    - namespaceSelector:
        matchLabels:
          name: cloudbridge-control
    - podSelector:
        matchLabels:
          app: cloudbridge-relay
    ports:
    - protocol: UDP
      port: 443
    - protocol: UDP
      port: 51820
    - protocol: UDP
      port: 3478
    - protocol: UDP
      port: 9090
    - protocol: TCP
      port: 8444
    - protocol: TCP
      port: 8443
      
  # Доступ к AI сервису для оптимизации маршрутизации
  - to:
    - podSelector:
        matchLabels:
          app: ai-service
    ports:
    - protocol: TCP
      port: 8083
      
  # Доступ к мониторингу
  - to:
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 9090

