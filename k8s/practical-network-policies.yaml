  - from:
    - podSelector:
        matchLabels:
          app: gaming-client
    ports:
    - protocol: UDP
      port: 443
    - protocol: UDP
      port: 51820
    - protocol: UDP
      port: 3478
      
  - from:
    - podSelector:
        matchLabels:
          app: streaming-client
    ports:
    - protocol: UDP
      port: 443
    - protocol: UDP
      port: 51820
    - protocol: UDP
      port: 3478
      
  egress:
  # Исходящий трафик для праймтайма
  - to:
    - namespaceSelector:
        matchLabels:
          name: cloudbridge-control
    - podSelector:
        matchLabels:
          app: cloudbridge-relay
    ports:
    - protocol: UDP
      port: 443
    - protocol: UDP
      port: 51820
    - protocol: UDP
      port: 3478
    - protocol: UDP
      port: 9090
    - protocol: TCP
      port: 8444
    - protocol: TCP
      port: 8443
      
  # Доступ к CDN с приоритизацией
  - to:
    - podSelector:
        matchLabels:
          app: cdn-proxy
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
    - protocol: UDP
      port: 443
      
  # Доступ к AI сервису для праймтайм оптимизации
  - to:
    - podSelector:
        matchLabels:
          app: ai-service
    ports:
    - protocol: TCP
      port: 8083

---
# Calico Global Network Policy - глобальные правила
apiVersion: projectcalico.org/v3
kind: GlobalNetworkPolicy
metadata:
  name: cloudbridge-global-policy
spec:
  tier: security
  order: 100
  selector: app == "cloudbridge-relay"
  types:
  - Ingress
  - Egress
  
  ingress:
  # Глобальные правила для CloudBridge
  - action: Allow
    protocol: UDP
    source:
      selector: app == "cloudbridge-relay"
    destination:
      ports:
      - 443
      - 51820
      - 3478
      - 9090
      
  - action: Allow
    protocol: TCP
    source:
      selector: app == "cloudbridge-relay"
    destination:
      ports:
      - 8444
      - 8443
      
  egress:
  # Исходящие правила для CloudBridge
  - action: Allow
    protocol: UDP
    destination:
      selector: app == "cloudbridge-relay"
    source:
      ports:
      - 443
      - 51820
      - 3478
      - 9090
      
  - action: Allow
    protocol: TCP
    destination:
      selector: app == "cloudbridge-relay"
    source:
      ports:
      - 8444
      - 8443
      
  # Доступ к внешним сервисам
  - action: Allow
    protocol: TCP
    destination:
      nets:
      - 0.0.0.0/0
    source:
      ports:
      - 80
      - 443
      - 53
      
  - action: Allow
    protocol: UDP
    destination:
      nets:
      - 0.0.0.0/0
    source:
      ports:
      - 53
      - 123

