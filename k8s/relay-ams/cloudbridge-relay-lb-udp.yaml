---
apiVersion: v1
kind: Service
metadata:
  name: cloudbridge-relay-lb-udp
  namespace: cloudbridge-relay
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/component: relay
    app.kubernetes.io/part-of: cloudbridge-relay
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  ipFamilyPolicy: PreferDualStack
  selector:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/component: relay
  ports:
  - name: quic-udp
    port: 5555
    targetPort: 5555
    protocol: UDP
  - name: p2p-quic-udp
    port: 5556
    targetPort: 5556
    protocol: UDP
  - name: enhanced-quic-udp
    port: 9092
    targetPort: 9092
    protocol: UDP
  - name: stun-server-udp
    port: 19302
    targetPort: 19302
    protocol: UDP
  - name: wireguard-udp
    port: 51820
    targetPort: 51820
    protocol: UDP

