---
apiVersion: v1
kind: Service
metadata:
  name: cloudbridge-relay-lb-tcp
  namespace: cloudbridge-relay
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/component: relay
    app.kubernetes.io/part-of: cloudbridge-relay
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/component: relay
  ports:
      - name: relay-tcp
        port: 5550
        targetPort: 5550
        protocol: TCP
      - name: metrics
        port: 5551
        targetPort: 5551
        protocol: TCP
      - name: p2p-api
        port: 5552
        targetPort: 5552
        protocol: TCP
      - name: http-api
        port: 5553
        targetPort: 5553
        protocol: TCP
      - name: https-api
        port: 5554
        targetPort: 5554
        protocol: TCP
      - name: health-check
        port: 9091
        targetPort: 9091
        protocol: TCP
      - name: grpc
        port: 8444
        targetPort: 8444
        protocol: TCP

